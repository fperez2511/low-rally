<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f4c9a0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>Low Rally</title>
  </head>
  <body>
    <div id="app"></div>

    <div id="hud" hidden>
      <div class="hud-block">
        <span class="hud-label">Speed</span>
        <span class="hud-value"><span id="hud-speed">0</span><small> km/h</small></span>
      </div>
      <div class="hud-block hud-center">
        <span class="hud-label">Time</span>
        <span class="hud-value" id="hud-time">0:00.00</span>
      </div>
      <div class="hud-block hud-right">
        <span class="hud-label">Best</span>
        <span class="hud-value" id="hud-best">--:--.--</span>
      </div>
      <button id="hud-restart" type="button">Restart</button>
    </div>

    <div id="banner" hidden></div>
    <button id="banner-lb" class="lb-btn" type="button" hidden>Leaderboard</button>

    <div id="leaderboard" hidden role="dialog" aria-modal="true" aria-labelledby="lb-title">
      <div class="lb-card">
        <h2 id="lb-title">Leaderboard</h2>
        <ol id="lb-list"></ol>
        <p id="lb-empty" hidden>No runs yet. Drive a lap!</p>
        <div class="lb-actions">
          <button id="lb-clear" class="lb-btn lb-btn-quiet" type="button">Clear</button>
          <button id="lb-close" class="lb-btn" type="button">Close</button>
        </div>
      </div>
    </div>

    <div id="touch" hidden>
      <div class="zone zone-left" data-steer="-1"><span>&#8249;</span></div>
      <div class="zone zone-right" data-steer="1"><span>&#8250;</span></div>
      <div class="brake-btn" id="touch-brake">Brake</div>
    </div>

    <div id="start">
      <h1>Low Rally</h1>
      <p class="start-cta">Tap to start</p>
      <button id="start-lb" class="lb-btn" type="button">Leaderboard</button>
      <p class="start-help">
        Touch: hold left / right side to steer, brake button to slow down.<br />
        Keyboard: arrows or WASD, space to brake, R to restart.
      </p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
